name: CI/CD pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # -------------------------
  # 1️⃣ Build & Test Job
  # -------------------------
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      report-path: reports/test-report.html
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-html

      - name: Run tests with HTML report
        run: |
          mkdir -p reports
          pytest tests --html=reports/test-report.html --self-contained-html

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test-report.html

  # -------------------------
  # 2️⃣ Deployment Job
  # -------------------------
  deploy:
    needs: build-and-test      # Déploiement uniquement si tests réussissent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          chmod +x deploy.sh
          ./deploy.sh
      # -------------------------
      # 3️⃣ Email Notification
      # -------------------------
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          from: CI/CD Pipeline <${{ secrets.EMAIL_USER }}>
          to: ${{ secrets.EMAIL_TO }}
          subject: "✅ Déploiement réussi - CI/CD Pipeline"
          body: |
            Bonjour,

            Les tests ont réussi et le déploiement s'est terminé avec succès.

            Repository : ${{ github.repository }}
            Branche    : ${{ github.ref_name }}
            Commit     : ${{ github.sha }}

            — GitHub Actions
